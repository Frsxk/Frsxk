name: pink snake

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: generate the snake
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?color_snake=#ff5c7a&color_dots=#fff0f2,#ffd1d6,#ffb8bf,#ff8fa3,#e05a7a
            dist/snake-dark.svg?color_snake=#ffb8bf&color_dots=#1f1a1d,#4a2a35,#7a3e4f,#c46b82,#ffb8bf

      - name: push to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
